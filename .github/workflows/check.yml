name: Validate setup toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline gate with Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/check.ps1
      - name: Run offline gate with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/check.ps1
