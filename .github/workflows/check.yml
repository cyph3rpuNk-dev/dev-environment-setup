name: Validate setup toolkit
# Pull requests and main are checked; a branch push with an open pull request no
# longer runs the same jobs twice. Run manually to check a branch without one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PSScriptAnalyzer runs once, pinned, on Linux. Other runner images may ship
          # a different analyzer version, so the gate skips it there.
          - os: windows-latest
            shell: powershell
            pssa: skip
          - os: windows-latest
            shell: pwsh
            pssa: skip
          - os: ubuntu-latest
            shell: pwsh
            pssa: 1.23.0
          # macOS runs the same gate with its own Bash 3.2 and BSD tools.
          - os: macos-latest
            shell: pwsh
            pssa: skip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DEVSETUP_PSSA_VERSION: ${{ matrix.pssa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned PSScriptAnalyzer
        if: matrix.pssa != 'skip'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:DEVSETUP_PSSA_VERSION -Repository PSGallery -Scope CurrentUser
      - name: Run offline gate with Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./scripts/check.ps1
      - name: Run offline gate with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./scripts/check.ps1

  # The Linux bootstrap and scaffolder must work on each supported package family,
  # not only on the Ubuntu runner image. Everything external remains mocked.
  linux-distributions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            prepare: dnf install -y git-core diffutils gawk grep sed findutils coreutils ShellCheck
          - image: debian:stable
            prepare: apt-get update && apt-get install -y --no-install-recommends git ca-certificates shellcheck
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - name: Install test prerequisites
        run: ${{ matrix.prepare }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bash syntax
        shell: bash
        run: for f in *.sh helpers/*.sh scripts/*.sh tests/*.sh templates/foundation/*.sh.template; do bash -n "$f"; done
      - name: ShellCheck
        shell: bash
        run: shellcheck -S warning -x *.sh helpers/*.sh scripts/*.sh tests/*.sh templates/foundation/*.sh.template
      - name: Bash regression tests
        shell: bash
        run: bash tests/test-bash.sh
      - name: Bash regression tests with BSD-style option parsing (as on macOS)
        shell: bash
        run: POSIXLY_CORRECT=1 bash tests/test-bash.sh

  # Every commit must be authored by the maintainer, with no co-author, session-link
  # or bot credit. Full history is checked so nothing can slip in unnoticed.
  commit-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Commits credit only the maintainer
        env:
          ALLOWED_EMAILS: 261779228+cyph3rpuNk-dev@users.noreply.github.com
        run: bash scripts/check-commit-identity.sh HEAD
