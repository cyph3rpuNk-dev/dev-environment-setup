name: Validate setup toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
          - os: ubuntu-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run offline repository gate
        shell: ${{ matrix.shell }}
        run: ./scripts/check.ps1
